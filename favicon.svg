<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#5de6ff" />
      <stop offset="100%" stop-color="#ffafd3" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#bdc2ff" />
      <stop offset="100%" stop-color="#5de6ff" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#ring-grad)" stroke-width="2.5" />

  <!-- Inner Soft Glow Circle -->
  <circle cx="32" cy="32" r="22" fill="#818cf8" fill-opacity="0.15" />

  <!-- Styled Letter N -->
  <text x="32" y="44" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="900" 
        text-anchor="middle" 
        fill="url(#text-grad)">N</text>

  <!-- Code Brackets Highlight Tag -->
  <path d="M 12,24 L 7,32 L 12,40 M 52,24 L 57,32 L 52,40" stroke="#5de6ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
